name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Hardware packages (gpiod, gpiodevice, inky) and flask are not needed:
      # tests mock them via tests/conftest.py and no test imports the web app.
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
